<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Sun & Solar Emblem -->
  <g transform="translate(15, 10)">
    <!-- Sun Ray Glow -->
    <circle cx="50" cy="50" r="42" fill="#FEF3C7" />
    <circle cx="50" cy="50" r="32" fill="url(#sunGrad)" />
    
    <!-- Solar PV Cells Overlay -->
    <path d="M 28 35 L 72 35 L 76 68 L 24 68 Z" fill="url(#panelGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="50" y1="35" x2="50" y2="68" stroke="#FFFFFF" stroke-width="1" />
    <line x1="26" y1="52" x2="74" y2="52" stroke="#FFFFFF" stroke-width="1" />
    
    <!-- Green Energy Leaf Accent -->
    <path d="M 50 68 C 65 65 78 52 76 38 C 76 56 62 74 50 78 C 38 74 24 56 24 38 C 22 52 35 65 50 68 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Brand Typography -->
  <text x="125" y="46" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="0.5">
    SHREE ABHI
  </text>
  <text x="125" y="72" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#D97706" letter-spacing="1.2">
    ELECTRICALS &amp; ENGINEERING PVT. LTD.
  </text>
  <text x="125" y="94" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.8">
    MNRE REGISTERED SOLAR EPC &amp; RESCO • CHENNAI
  </text>
</svg>
